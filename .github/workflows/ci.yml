name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # PHP Tests + Static Analysis
  # ──────────────────────────────────────────────
  php:
    name: PHP (${{ matrix.check }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        check: [test, pint]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, json, bcmath, gd, pdo, sqlite
          coverage: none

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: php-composer-${{ hashFiles('composer.lock') }}
          restore-keys: php-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # ── PHPUnit ──
      - name: Copy .env
        if: matrix.check == 'test'
        run: cp .env.example .env.testing

      - name: Generate app key
        if: matrix.check == 'test'
        run: php artisan key:generate --env=testing

      - name: Run migrations
        if: matrix.check == 'test'
        run: php artisan migrate --env=testing --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

      - name: Run PHPUnit
        if: matrix.check == 'test'
        run: php artisan test --env=testing
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

      # ── Laravel Pint ──
      - name: Run Laravel Pint
        if: matrix.check == 'pint'
        run: vendor/bin/pint --test

  # ──────────────────────────────────────────────
  # Frontend (ESLint)
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend (ESLint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        run: npm run build

  # ──────────────────────────────────────────────
  # PHPStan (non-blocking)
  # ──────────────────────────────────────────────
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, json, bcmath, gd, pdo, pgsql
          coverage: none

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: php-composer-${{ hashFiles('composer.lock') }}
          restore-keys: php-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=512M
        continue-on-error: true
