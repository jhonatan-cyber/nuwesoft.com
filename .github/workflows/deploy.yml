name: Deploy to VPS

on:
  push:
    branches:
      - main

env:
  APP_IMAGE: nuwesoft-app:latest


jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e
            echo "=== Iniciando Despliegue ==="
            cd /var/www/nuwesoft.com

            # Save current commit for rollback
            PREV_COMMIT=$(git rev-parse HEAD)
            echo "Previous commit: $PREV_COMMIT"

            # Pull latest changes
            echo "Pulling latest changes..."
            git pull origin main
            NEW_COMMIT=$(git rev-parse HEAD)
            echo "New commit: $NEW_COMMIT"

            # Build and restart containers
            echo "Building containers..."
            docker compose -f compose.prod.yaml up -d --build --remove-orphans

            # Wait for healthcheck (max 60s)
            echo "Waiting for app to be healthy..."
            RETRIES=12
            until [ $RETRIES -eq 0 ] || docker compose -f compose.prod.yaml exec -T web curl -sf http://localhost/ > /dev/null 2>&1; do
              RETRIES=$((RETRIES - 1))
              echo "Waiting... ($RETRIES attempts left)"
              sleep 5
            done

            if [ $RETRIES -eq 0 ]; then
              echo "ERROR: App failed healthcheck. Rolling back..."
              git checkout $PREV_COMMIT
              docker compose -f compose.prod.yaml up -d --build --remove-orphans
              echo "Rolled back to $PREV_COMMIT"
              exit 1
            fi

            # Cleanup old images
            docker image prune -f

            echo "=== Deploy successful ==="
            echo "Deployed commit: $NEW_COMMIT"

      - name: Notify success
        if: success()
        run: |
          echo "✅ Deploy succeeded"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deploy failed — rollback executed"
