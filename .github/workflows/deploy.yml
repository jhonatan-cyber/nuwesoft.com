name: Deploy to VPS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main

env:
  APP_IMAGE: nuwesoft-app:latest

jobs:
  deploy:
    name: Deploy to Production
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to VPS via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "=== Iniciando Despliegue ==="
            cd /var/www/nuwesoft.com

            # Save current commit for rollback
            PREV_COMMIT=$(git rev-parse HEAD)
            echo "Previous commit: $PREV_COMMIT"

            # Backup database BEFORE pulling new code
            echo "Backing up database..."
            docker compose -f compose.prod.yaml exec -T web php artisan backup:database --compress || { echo "ERROR: Backup failed; deploy cancelled"; exit 1; }
            LATEST_BACKUP=$(docker compose -f compose.prod.yaml exec -T web sh -lc "ls -1t storage/app/backups/backup_*.sql.gz | head -1")
            docker compose -f compose.prod.yaml exec -T web sh -lc "test -s '$LATEST_BACKUP' && gzip -t '$LATEST_BACKUP'" || { echo "ERROR: Backup verification failed; deploy cancelled"; exit 1; }
            BACKUP_SIZE=$(docker compose -f compose.prod.yaml exec -T web sh -lc "du -h '$LATEST_BACKUP' | cut -f1")
            echo "Backup size: $BACKUP_SIZE"

            rollback_deploy() {
              echo "Restoring database from $LATEST_BACKUP..."
              docker compose -f compose.prod.yaml exec -T web php artisan backup:restore "$LATEST_BACKUP" --force || {
                echo "CRITICAL: Database restore failed. Manual intervention required."
                return 1
              }
              git checkout "$PREV_COMMIT"
              docker compose -f compose.prod.yaml up -d --build --remove-orphans || return 1
              docker compose -f compose.prod.yaml exec -T web php artisan optimize:clear || true
            }

            # Pull latest changes
            echo "Pulling latest changes..."
            git pull origin main || { echo "ERROR: git pull failed"; exit 1; }
            NEW_COMMIT=$(git rev-parse HEAD)
            echo "New commit: $NEW_COMMIT"

            # Build and restart containers
            echo "Building containers..."
            docker compose -f compose.prod.yaml up -d --build --remove-orphans || { echo "ERROR: docker compose failed"; exit 1; }

            # Run database migrations
            echo "Running database migrations..."
            docker compose -f compose.prod.yaml exec -T web php artisan migrate --force || { echo "ERROR: Migration failed. Rolling back..."; rollback_deploy; exit 1; }

            # Clear and rebuild caches
            echo "Optimizing application..."
            docker compose -f compose.prod.yaml exec -T web php artisan config:cache 2>/dev/null || true
            docker compose -f compose.prod.yaml exec -T web php artisan route:cache 2>/dev/null || true
            docker compose -f compose.prod.yaml exec -T web php artisan view:cache 2>/dev/null || true

            # Wait for healthcheck (max 60s)
            echo "Waiting for app to be healthy..."
            RETRIES=12
            until [ $RETRIES -eq 0 ] || docker compose -f compose.prod.yaml exec -T web curl -sf http://localhost/ > /dev/null 2>&1; do
              RETRIES=$((RETRIES - 1))
              echo "Waiting... ($RETRIES attempts left)"
              sleep 5
            done

            if [ $RETRIES -eq 0 ]; then
              echo "ERROR: App failed healthcheck. Rolling back..."
              rollback_deploy || exit 1
              # Wait for rollback to be healthy
              ROLLBACK_RETRIES=12
              until [ $ROLLBACK_RETRIES -eq 0 ] || docker compose -f compose.prod.yaml exec -T web curl -sf http://localhost/ > /dev/null 2>&1; do
                ROLLBACK_RETRIES=$((ROLLBACK_RETRIES - 1))
                sleep 5
              done
              if [ $ROLLBACK_RETRIES -eq 0 ]; then
                echo "CRITICAL: Rollback also failed healthcheck! Manual intervention required."
              fi
              echo "Rolled back to $PREV_COMMIT"
              exit 1
            fi

            # Cleanup old images (ignore errors)
            docker image prune -f 2>/dev/null || true

            # Cleanup backups older than 30 days
            docker compose -f compose.prod.yaml exec -T web find storage/app/backups -name '*.sql.gz' -mtime +30 -delete 2>/dev/null || true

            echo "=== Deploy successful ==="
            echo "Deployed commit: $NEW_COMMIT"

      # ──────────────────────────────────────────────
      # Discord notifications
      # ──────────────────────────────────────────────
      - name: Notify Discord — Deploy Success
        if: success()
        continue-on-error: true
        run: |
          curl -s -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "✅ Deploy Exitoso",
                "description": "Nuwesoft se desplegó correctamente en producción.",
                "color": 3066993,
                "fields": [
                  {"name": "🌐 URL", "value": "https://nuwesoft.nuwesomme.cloud", "inline": false},
                  {"name": "📋 Commit", "value": "${{ github.event.workflow_run.head_sha }}", "inline": false},
                  {"name": "💾 Backup", "value": "DB antes del deploy", "inline": true},
                  {"name": "👤 Autor", "value": "${{ github.actor }}", "inline": true},
                  {"name": "📦 Repo", "value": "${{ github.repository }}", "inline": true}
                ],
                "footer": {"text": "GitHub Actions"},
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Notify Discord — Deploy Failed
        if: failure()
        continue-on-error: true
        run: |
          curl -s -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ Deploy Falló",
                "description": "El despliegue de Nuwesoft falló. Puede haberse ejecutado un rollback automático.",
                "color": 15158332,
                "fields": [
                  {"name": "📋 Commit", "value": "${{ github.event.workflow_run.head_sha }}", "inline": false},
                  {"name": "👤 Autor", "value": "${{ github.actor }}", "inline": true},
                  {"name": "📦 Repo", "value": "${{ github.repository }}", "inline": true},
                  {"name": "🔗 Logs", "value": "[Ver logs del workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false}
                ],
                "footer": {"text": "GitHub Actions"},
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
