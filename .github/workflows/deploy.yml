name: Deploy to VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "=== Iniciando Despliegue ==="
            cd /var/www/nuwesoft.com

            PHP_BIN=$(command -v php || command -v php8.3 || command -v php8.4 || true)
            if [ -z "$PHP_BIN" ]; then
              echo "PHP CLI not found; installing the production CLI runtime..."
              sudo apt-get update -qq
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                php8.3-cli php8.3-bcmath php8.3-curl php8.3-gd php8.3-mbstring \
                php8.3-pgsql php8.3-xml php8.3-zip unzip
              PHP_BIN=$(command -v php8.3 || command -v php || true)
            fi
            if [ -z "$PHP_BIN" ]; then
              echo "ERROR: PHP CLI was not found on the VPS"
              exit 1
            fi
            echo "Using PHP: $PHP_BIN"

            # Use the system Composer when available; otherwise install a
            # verified project-local copy for non-interactive deployments.
            COMPOSER_BIN=$(command -v composer || true)
            if [ -z "$COMPOSER_BIN" ]; then
              echo "Composer not found; installing a local verified copy..."
              mkdir -p .deploy-tools
              EXPECTED_SIGNATURE=$(curl -fsSL https://composer.github.io/installer.sig)
              "$PHP_BIN" -r "copy('https://getcomposer.org/installer', '.composer-setup.php');"
              ACTUAL_SIGNATURE=$("$PHP_BIN" -r "echo hash_file('sha384', '.composer-setup.php');")
              if [ "$EXPECTED_SIGNATURE" != "$ACTUAL_SIGNATURE" ]; then
                echo "ERROR: Invalid Composer installer signature"
                rm -f .composer-setup.php
                exit 1
              fi
              "$PHP_BIN" .composer-setup.php --quiet --install-dir=.deploy-tools --filename=composer
              rm -f .composer-setup.php
              COMPOSER_BIN="$PWD/.deploy-tools/composer"
            fi

            # Save current commit for rollback
            PREV_COMMIT=$(git rev-parse HEAD)
            echo "Previous commit: $PREV_COMMIT"

            # Backup database BEFORE pulling new code
            echo "Backing up database..."
            "$PHP_BIN" artisan backup:database --compress 2>/dev/null || echo "WARNING: Backup failed, continuing deploy..."
            BACKUP_SIZE=$(ls -lh storage/app/backups/ 2>/dev/null | tail -1 | awk '{print $5}' || echo "unknown")
            echo "Backup size: $BACKUP_SIZE"

            # Pull latest changes
            echo "Pulling latest changes..."
            git pull origin main || { echo "ERROR: git pull failed"; exit 1; }
            NEW_COMMIT=$(git rev-parse HEAD)
            echo "New commit: $NEW_COMMIT"

            # Install dependencies, build assets, and update the application
            echo "Installing production dependencies..."
            "$COMPOSER_BIN" install --no-dev --no-interaction --prefer-dist --optimize-autoloader || { echo "ERROR: composer install failed"; exit 1; }
            npm ci --legacy-peer-deps || { echo "ERROR: npm install failed"; exit 1; }
            npm run build || { echo "ERROR: frontend build failed"; exit 1; }
            "$PHP_BIN" artisan migrate --force || { echo "ERROR: migrations failed"; exit 1; }
            "$PHP_BIN" artisan optimize || { echo "ERROR: application optimization failed"; exit 1; }
            sudo systemctl reload nginx || { echo "ERROR: nginx reload failed"; exit 1; }
            sudo systemctl restart php8.3-fpm || { echo "ERROR: PHP-FPM restart failed"; exit 1; }

            # Wait for healthcheck (max 60s)
            echo "Waiting for app to be healthy..."
            RETRIES=12
            until [ $RETRIES -eq 0 ] || curl -sf https://nuwesoft.nuwesomme.cloud/ > /dev/null 2>&1; do
              RETRIES=$((RETRIES - 1))
              echo "Waiting... ($RETRIES attempts left)"
              sleep 5
            done

            if [ $RETRIES -eq 0 ]; then
              echo "ERROR: App failed healthcheck. Rolling back..."
              git checkout $PREV_COMMIT
              "$COMPOSER_BIN" install --no-dev --no-interaction --prefer-dist --optimize-autoloader
              npm ci --legacy-peer-deps
              npm run build
              "$PHP_BIN" artisan optimize
              sudo systemctl reload nginx
              sudo systemctl restart php8.3-fpm
              echo "Rolled back to $PREV_COMMIT"
              exit 1
            fi

            # Cleanup backups older than 30 days
            find storage/app/backups -name '*.sql.gz' -mtime +30 -delete 2>/dev/null || true

            echo "=== Deploy successful ==="
            echo "Deployed commit: $NEW_COMMIT"

      # ──────────────────────────────────────────────
      # Discord notifications
      # ──────────────────────────────────────────────
      - name: Notify Discord — Deploy Success
        if: success()
        continue-on-error: true
        run: |
          curl -s -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "✅ Deploy Exitoso",
                "description": "Nuwesoft se desplegó correctamente en producción.",
                "color": 3066993,
                "fields": [
                  {"name": "🌐 URL", "value": "https://nuwesoft.nuwesomme.cloud", "inline": false},
                  {"name": "📋 Commit", "value": "${{ github.sha }}", "inline": false},
                  {"name": "💾 Backup", "value": "DB antes del deploy", "inline": true},
                  {"name": "👤 Autor", "value": "${{ github.actor }}", "inline": true},
                  {"name": "📦 Repo", "value": "${{ github.repository }}", "inline": true}
                ],
                "footer": {"text": "GitHub Actions"},
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Notify Discord — Deploy Failed
        if: failure()
        continue-on-error: true
        run: |
          curl -s -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ Deploy Falló",
                "description": "El despliegue de Nuwesoft falló. Puede haberse ejecutado un rollback automático.",
                "color": 15158332,
                "fields": [
                  {"name": "📋 Commit", "value": "${{ github.sha }}", "inline": false},
                  {"name": "👤 Autor", "value": "${{ github.actor }}", "inline": true},
                  {"name": "📦 Repo", "value": "${{ github.repository }}", "inline": true},
                  {"name": "🔗 Logs", "value": "[Ver logs del workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false}
                ],
                "footer": {"text": "GitHub Actions"},
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
