name: Staging Cleanup

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  STAGING_BASE_DIR: /var/www/staging

jobs:
  cleanup:
    name: Cleanup Staging
    runs-on: ubuntu-latest

    steps:
      - name: Get PR number
        id: pr
        run: echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Remove Staging from VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            PR=${{ steps.pr.outputs.number }}
            STAGING_DIR="${STAGING_BASE_DIR}/pr-${PR}"

            echo "=== Cleaning up staging for PR #${PR} ==="

            if [ -d "$STAGING_DIR" ]; then
              cd "$STAGING_DIR"

              # Stop and remove containers, networks, volumes
              docker compose -f compose.staging.yaml --env-file .env down -v --remove-orphans 2>/dev/null || true

              # Remove staging directory
              cd /
              rm -rf "$STAGING_DIR"

              echo "=== Staging PR #${PR} removed ==="
            else
              echo "Staging directory not found for PR #${PR} — nothing to clean"
            fi

      - name: Notify Discord — Staging Removed
        if: success()
        continue-on-error: true
        run: |
          curl -s -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "🗑️ Staging Eliminado",
                "description": "El staging del PR #${{ github.event.pull_request.number }} fue eliminado.",
                "color": 10070709,
                "fields": [
                  {"name": "📋 PR", "value": "${{ github.event.pull_request.title }} (#${{ github.event.pull_request.number }})", "inline": false},
                  {"name": "👤 Autor", "value": "${{ github.actor }}", "inline": true},
                  {"name": "📌 Razón", "value": "${{ github.event.pull_request.merged && 'Mergeado' || 'Cerrado sin merge' }}", "inline": true}
                ],
                "footer": {"text": "GitHub Actions — Staging"},
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
