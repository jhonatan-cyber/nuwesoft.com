server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html/public;

    # Permitir la subida de archivos/imágenes de hasta 64MB
    client_max_body_size 64M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "no-referrer-when-downgrade";

    index index.php;

    charset utf-8;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Never cache HTML pages — they reference Vite chunks by hash
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Vite build assets — short cache so deploys propagate fast
    location /build/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        access_log off;

        # If a chunk is missing (404 after deploy), show friendly reload page
        error_page 404 /chunk-error.html;
    }

    # Other static assets (images, fonts, etc.) — long cache
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # Procesar archivos PHP a través de PHP-FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Evitar error 502 por cabeceras muy grandes (ej. cookies de sesion de Laravel/Inertia)
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
