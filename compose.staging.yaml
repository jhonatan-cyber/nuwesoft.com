services:
  # ----------------------------------------------------
  # Staging Web (Nginx + PHP-FPM)
  # ----------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: "nuwesoft-staging:latest"
    restart: unless-stopped
    ports:
      - "${STAGING_APP_PORT:-8081}:80"
      - "${STAGING_REVERB_PORT:-8091}:8090"
    environment:
      APP_ENV: "staging"
      APP_DEBUG: "true"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"
      APP_NAME: "Nuwesoft (Staging)"

      DB_CONNECTION: pgsql
      DB_HOST: pgsql-staging
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-nuwesoft_staging}"
      DB_USERNAME: "${DB_USERNAME:-staging}"
      DB_PASSWORD: "${DB_PASSWORD}"

      REDIS_HOST: redis-staging
      REDIS_PORT: 6379

      REVERB_ENABLED: "false"
      QUEUE_WORKERS: "1"
    volumes:
      - "staging_storage:/var/www/html/storage/app/public"
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      pgsql-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy

  # ----------------------------------------------------
  # Staging PostgreSQL
  # ----------------------------------------------------
  pgsql-staging:
    image: "postgres:18-alpine"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-nuwesoft_staging}"
      POSTGRES_USER: "${DB_USERNAME:-staging}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - "staging_pgsql:/var/lib/postgresql"
    networks:
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # Staging Redis
  # ----------------------------------------------------
  redis-staging:
    image: "redis:alpine"
    restart: unless-stopped
    volumes:
      - "staging_redis:/data"
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  staging-network:
    driver: bridge

volumes:
  staging_pgsql:
    driver: local
  staging_redis:
    driver: local
  staging_storage:
    driver: local
