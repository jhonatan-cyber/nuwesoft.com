services:
    # ----------------------------------------------------
    # Servidor Web (Nginx + PHP-FPM) - Aplicación Laravel
    # ----------------------------------------------------
    web:
        build:
            context: .
            dockerfile: Dockerfile.prod
        image: "nuwesoft-app:latest"
        restart: always
        ports:
            # Exponemos el Nginx interno (puerto 80) al puerto APP_PORT del host (por defecto 8080)
            # para que el proxy inverso (Nginx / Nginx Proxy Manager / Traefik) le pase el tráfico.
            - "${APP_PORT:-8080}:80"
            # Si se usa Laravel Reverb para WebSockets en producción
            - "${REVERB_PORT:-8090}:8090"
        environment:
            # Laravel leerá directamente las variables de entorno inyectadas
            APP_ENV: "${APP_ENV:-production}"
            APP_DEBUG: "${APP_DEBUG:-false}"
            APP_KEY: "${APP_KEY}"
            APP_URL: "${APP_URL}"
            CHROME_PATH: "/usr/bin/chromium"
            CAPTURE_MAX_PAGES: "${CAPTURE_MAX_PAGES:-20}"

            DB_CONNECTION: pgsql
            DB_HOST: pgsql
            DB_PORT: 5432
            DB_DATABASE: "${DB_DATABASE}"
            DB_USERNAME: "${DB_USERNAME}"
            DB_PASSWORD: "${DB_PASSWORD}"

            REDIS_HOST: redis
            REDIS_PORT: 6379

            # Optional: Enable Reverb WebSocket server
            REVERB_ENABLED: "${REVERB_ENABLED:-true}"
            # Mail (override .env baked in image)
            MAIL_MAILER: "${MAIL_MAILER:-smtp}"
            MAIL_HOST: "${MAIL_HOST:-smtp.gmail.com}"
            MAIL_PORT: "${MAIL_PORT:-587}"
            MAIL_USERNAME: "${MAIL_USERNAME}"
            MAIL_PASSWORD: "${MAIL_PASSWORD}"
            MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
            MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-jhonatanancasi@gmail.com}"
            MAIL_FROM_NAME: "${MAIL_FROM_NAME:-NUWESOFT}"
            MAIL_ADMIN_ADDRESS: "${MAIL_ADMIN_ADDRESS:-jhonatanancasi@gmail.com}"

            # Optional: Number of queue workers
            QUEUE_WORKERS: "${QUEUE_WORKERS:-1}"
        volumes:
            # Persistencia de los archivos subidos por los usuarios (uploads)
            - "storage_data:/var/www/html/storage/app/public"
        networks:
            - production-network
        healthcheck:
            test: ["CMD", "curl", "-sf", "http://localhost/"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # ----------------------------------------------------
    # Base de Datos PostgreSQL
    # ----------------------------------------------------
    pgsql:
        image: "postgres:18-alpine"
        restart: always
        # Expuesto SOLO en localhost del VPS (no público) para permitir túneles SSH de desarrollo.
        # Puerto host 15432: el 5432 nativo del VPS está ocupado.
        # Acceso desde dev: ssh -L 15432:127.0.0.1:15432 <vps>  (ver scripts/db-tunnel.ps1)
        ports:
            - "127.0.0.1:${FORWARD_DB_PORT:-15432}:5432"
        environment:
            POSTGRES_DB: "${DB_DATABASE}"
            POSTGRES_USER: "${DB_USERNAME}"
            POSTGRES_PASSWORD: "${DB_PASSWORD}"
        volumes:
            # En Postgres 18+ el volumen debe apuntar a la raíz /var/lib/postgresql
            - "pgsql_data:/var/lib/postgresql"
        networks:
            - production-network
        healthcheck:
            # Usar las variables de entorno internas del contenedor para el healthcheck
            test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
            interval: 5s
            timeout: 5s
            retries: 5

    # ----------------------------------------------------
    # Servidor Redis (Caché, Colas y Sesiones)
    # ----------------------------------------------------
    redis:
        image: "redis:alpine"
        restart: always
        # NO se expone ningún puerto al host por seguridad (acceso solo interno)
        volumes:
            - "redis_data:/data"
        networks:
            - production-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

networks:
    production-network:
        driver: bridge

volumes:
    pgsql_data:
        driver: local
    redis_data:
        driver: local
    storage_data:
        driver: local
