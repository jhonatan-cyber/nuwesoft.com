services:
    # ----------------------------------------------------
    # Servidor Web (Nginx + PHP-FPM) - Aplicación Laravel
    # ----------------------------------------------------
    web:
        build:
            context: .
            dockerfile: Dockerfile.prod
        image: 'nuwesoft-app:latest'
        restart: always
        ports:
            # Exponemos el Nginx interno (puerto 80) al puerto APP_PORT del host (por defecto 8080)
            # para que el proxy inverso (Nginx / Nginx Proxy Manager / Traefik) le pase el tráfico.
            - '${APP_PORT:-8080}:80'
            # Si se usa Laravel Reverb para WebSockets en producción
            - '${REVERB_PORT:-8090}:8090'
        environment:
            # Laravel leerá directamente las variables de entorno inyectadas
            APP_ENV: '${APP_ENV:-production}'
            APP_DEBUG: '${APP_DEBUG:-false}'
            APP_KEY: '${APP_KEY}'
            APP_URL: '${APP_URL}'
            
            DB_CONNECTION: pgsql
            DB_HOST: pgsql
            DB_PORT: 5432
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            
            REDIS_HOST: redis
            REDIS_PORT: 6379
        volumes:
            # Persistencia de los archivos subidos por los usuarios (uploads)
            - 'storage_data:/var/www/html/storage/app/public'
        networks:
            - production-network
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # ----------------------------------------------------
    # Base de Datos PostgreSQL
    # ----------------------------------------------------
    pgsql:
        image: 'postgres:18-alpine'
        restart: always
        # NO se expone ningún puerto al host por seguridad (acceso solo interno)
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            # En Postgres 18+ el volumen debe apuntar a la raíz /var/lib/postgresql
            - 'pgsql_data:/var/lib/postgresql'
        networks:
            - production-network
        healthcheck:
            # Usar las variables de entorno internas del contenedor para el healthcheck
            test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
            interval: 5s
            timeout: 5s
            retries: 5

    # ----------------------------------------------------
    # Servidor Redis (Caché, Colas y Sesiones)
    # ----------------------------------------------------
    redis:
        image: 'redis:alpine'
        restart: always
        # NO se expone ningún puerto al host por seguridad (acceso solo interno)
        volumes:
            - 'redis_data:/data'
        networks:
            - production-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

networks:
    production-network:
        driver: bridge

volumes:
    pgsql_data:
        driver: local
    redis_data:
        driver: local
    storage_data:
        driver: local
